name: Build and Push Docker Image

on:
  release:
    types:
      - published
  pull_request:

permissions:
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup QEMU and Buildx for multi-platform image build
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull data automatically for tag and label info
      -
        name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=auto
          images: |
            ghcr.io/${{ github.repository_owner }}/cloudflared
          tags: |
            type=pep440,pattern={{version}}
            type=sha
      
      # Build the Docker image with tags from metadata stage
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          # Push if not pull requested
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true